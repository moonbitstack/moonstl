name: Pages

# Publish the showcase at https://moonbitstack.github.io/moonstl.
# The site is rebuilt from source on every push to master, so the live page
# always reflects the current library: the API reference is regenerated from
# the package interfaces and the browser bundle is recompiled from site/bridge.
# The build is gated on site/check.py (reference in sync + bridge compiles +
# the fresh bundle actually runs) before anything is published.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: rebuild the site from source
        # build.py runs `moon update` in the bridge workspace first, so a fresh
        # checkout resolves moonjson / moonseed before compiling.
        # regenerates site/api.json from the interfaces, compiles site/bridge to
        # site/moonstl.js, and copies the bundle next to the page.
        run: python site/build.py

      - name: the site is in sync and runs
        run: python site/check.py

      - name: stage the public files
        run: |
          mkdir -p dist
          cp site/index.html site/moonstl.js site/api.json dist/
          ls -la dist

      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: .
